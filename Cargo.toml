[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/daemon",
    "crates/engine",
    "crates/fs",
    "crates/network",
    "crates/storage",
    "crates/protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2.0.21"
blake3 = "1.8.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter" ] }
