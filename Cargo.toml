[workspace]
resolver = "3"
members = [
    "apps/cli",
    "crates/engine",
    "crates/fs",
    "crates/network",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2.0.21"
rusqlite = { version = "0.43.0", features = [ "bundled" ] }
