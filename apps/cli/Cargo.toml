[package]
name = "cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rfsync"
path = "src/main.rs"

[dependencies]
rfsync-engine = { path = "../../crates/engine" }
rfsync-ipc = { path = "../../crates/ipc" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
tracing-subscriber.workspace = true
